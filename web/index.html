<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parry Perry</title>
<style>
  :root {
    --bg: #15151b; --panel: #1f1f28; --line: #33333f; --text: #e6e6ec; --dim: #9a9aa8;
    --lit: #f0b44c; --key: #2b2b36;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1184px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  #stage { position: relative; background: #1a0f18; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 384 / 216; }
  #kills { position: absolute; right: 10px; top: 8px; padding: 4px 8px; background: rgba(0,0,0,.55);
           border-radius: 4px; font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums; z-index: 3; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); z-index: 4; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  #pad { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { min-width: 44px; padding: 4px 8px; border-radius: 4px; background: var(--key); text-align: center;
         border: 1px solid var(--line); font-weight: 600; }
  .btn kbd { display: block; font: 11px ui-monospace, monospace; color: var(--dim); font-weight: 400; }
  .btn.on { background: var(--lit); color: #1a1206; border-color: var(--lit); }
  .btn.on kbd { color: #3d2c0b; }
  #log { list-style: none; margin: 0; padding: 0; font: 13px ui-monospace, monospace; min-height: 8.5em; }
  #log li { padding: 1px 0; color: var(--dim); }
  #log li:first-child { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #combos { margin-top: 16px; }
  .scroll { overflow-x: auto; }
  th { text-align: left; font-weight: 600; color: var(--dim); padding: 3px 6px; font-size: 12px; }
  td { padding: 3px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  td.pad { font-family: ui-monospace, monospace; white-space: nowrap; color: var(--lit); }
  td.keys { font-family: ui-monospace, monospace; white-space: nowrap; }
  td.how { color: var(--dim); }
  tr.playing td { background: #2c2a22; }
  #inputmon { margin-top: 16px; }
  #monitor { font: 12px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
  p.note { color: var(--dim); margin: 8px 0 0; font-size: 13px; }


  .row.one { grid-template-columns: 1fr; }
  #start-menu .panel { max-height: 96%; overflow: auto; max-width: 92%; }
  #start-menu h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); text-align: left; }
  #start-menu p.note { margin: 6px 0; text-align: left; font-size: 12px; }
  #start-menu button:focus-visible, #start-menu button:focus { outline: 2px solid var(--lit); outline-offset: 2px; }
  .menu-scroll { max-height: 38vh; min-width: min(560px, 80vw); overflow: auto; text-align: left; }
  .moves-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .moves-table td, .moves-table th { padding: 3px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  .moves-table td.pad { font-family: ui-monospace, monospace; white-space: nowrap; color: var(--lit); }
  .moves-table td.keys { font-family: ui-monospace, monospace; white-space: nowrap; }
  .moves-table td.how { color: var(--dim); }
  .gem-list { display: flex; flex-direction: column; gap: 8px; min-width: min(460px, 80vw); margin-bottom: 12px; }
  .gem-row { display: grid; grid-template-columns: 16px 1fr auto 1fr auto; gap: 10px; align-items: center; text-align: left; }
  .gem-swatch { width: 14px; height: 14px; transform: rotate(45deg); border: 1px solid #000; }
  .gem-count { font-variant-numeric: tabular-nums; font-weight: 600; }
  .gem-note { color: var(--dim); font-size: 12px; }
  #start-menu .actions.dev button { text-align: left; }

  /* Transparent overlay — canvas scene shows through as the menu image */
  #start-menu {
    position: absolute; inset: 0; z-index: 5;
    display: grid; place-items: center;
    background: transparent;
    pointer-events: none;
  }
  #start-menu[hidden] { display: none !important; }
  #start-menu .veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(12,8,16,.45) 0%, rgba(12,8,16,.62) 100%);
    pointer-events: none;
  }
  #start-menu .panel {
    position: relative; z-index: 1;
    pointer-events: auto;
    text-align: center; padding: 24px 28px;
    background: rgba(31,31,40,.9);
    border: 1px solid var(--line); border-radius: 10px; min-width: 240px;
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  #start-menu .hero {
    width: 132px; height: 93px; margin: 0 auto 12px;
    background: url('assets/moves/charge.png') 0 0 / auto 93px no-repeat;
    image-rendering: pixelated;
  }
  #start-menu.story { place-items: end center; padding-bottom: 6px; }
  #start-menu.story .veil { display: none; }
  #start-menu.story .panel { width: min(94%, 760px); padding: 10px 16px; text-align: left; background: rgba(14,12,20,.88); }
  #start-menu.story h2 { font-size: 13px; margin: 0 0 4px; color: var(--lit); }
  #start-menu.story p { font-size: 15px; color: #f0f0f6; margin: 0 0 8px; line-height: 1.35; }
  #start-menu.story .actions { flex-direction: row; gap: 8px; }
  #start-menu.story button { padding: 6px 14px; }
  #start-menu h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: .04em; }
  #start-menu p { margin: 0 0 16px; color: var(--dim); font-size: 13px; }
  #start-menu .actions { display: flex; flex-direction: column; gap: 10px; }
  #start-menu button {
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; border-radius: 6px;
    border: 1px solid var(--line); cursor: pointer; background: var(--key); color: var(--text);
  }
  #start-menu button.primary { background: var(--lit); color: #1a1206; border-color: var(--lit); }
  #start-menu button:disabled { opacity: .5; cursor: default; }
  #start-menu button:not(:disabled):hover { filter: brightness(1.08); }

  #btn-hud-start {
    position: absolute; left: 10px; bottom: 10px; z-index: 6;
    font: 600 13px system-ui, sans-serif; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--line); cursor: pointer;
    background: var(--lit); color: #1a1206; border-color: var(--lit);
    pointer-events: auto;
  }
  #btn-hud-start:disabled { opacity: .5; cursor: default; }
  #btn-hud-start:not(:disabled):hover { filter: brightness(1.08); }
  #stage:fullscreen, #stage:-webkit-full-screen {
    width: 100%; height: 100%; background: #000; display: grid; place-items: center;
  }
  #stage:fullscreen canvas, #stage:-webkit-full-screen canvas {
    width: min(100vw, 100vh * 384 / 216); height: auto; max-height: 100vh;
  }
</style>
</head>
<body>
<main>
  <h1>Parry Perry</h1>
  <div id="stage">
    <canvas id="view" width="384" height="216" tabindex="0" aria-label="Game view"></canvas>
    <div id="kills"></div>
    <button type="button" id="btn-hud-start" disabled>Menu</button>
    <div id="loading">Loading...</div>
    <div id="start-menu" hidden>
      <div class="veil"></div>
      <div class="panel">
        <div class="hero" aria-hidden="true"></div>
        <h2 id="menu-title">Parry Perry</h2>
        <p id="menu-msg">Defeat the goblins and orcs</p>
        <div id="menu-view"></div>
      </div>
    </div>
  </div>
  <div class="row one">
    <section>
      <h2>Last moves</h2>
      <ol id="log"></ol>
    </section>
  </div>
  <section id="inputmon">
    <h2>Input monitor</h2>
    <label class="note"><input type="checkbox" id="monitor-on"> Show raw key and controller events
      (for checking what a controller sends; hold a direction, press a button, and read the list)</label>
    <pre id="monitor"></pre>
  </section>
</main>
<script>window.BIBOO_VER = 'st79';   /* cache buster: change it whenever the game or its assets change */</script>
<script src="assets/data.js?v=st79"></script>
<script src="assets/moves_extra.js?v=st79"></script>
<script src="assets/creatures.js?v=st79"></script>
<script src="assets/arenas.js?v=st79"></script>
<script src="assets/bgs.js?v=st79"></script>
<script src="input.js?v=st79"></script>
<script src="progress.js?v=st79"></script>
<script src="ui.js?v=st79"></script>
<script src="levels.js?v=st79"></script>
<script src="game.js?v=st79"></script>
</body>
</html>
