name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish the same layout as the branch based Pages build (the site root is the repo root: a redirect
      # page at / and the game at /web/). The two deployments race, and if this one published only the web
      # folder as the site root, /web/ would 404 whenever this one finished last.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web _site/web
          cp index.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
